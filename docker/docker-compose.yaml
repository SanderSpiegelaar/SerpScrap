services:
  serpscrap-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serpscrap}
      POSTGRES_USER: ${POSTGRES_USER:-serpscrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  serpscrap-app:
    image: ${SERPSCRAP_IMAGE:-serpscrap:2.0.0-alpha.1}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    entrypoint: ["python"]
    command: ["-m", "serpscrap.api_server"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-serpscrap}:${POSTGRES_PASSWORD:-change-me}@serpscrap-db:5432/${POSTGRES_DB:-serpscrap}
      SERPSCRAP_DATA_DIR: /var/lib/serpscrap
      SERPSCRAP_CACHE_DIR: /var/lib/serpscrap/cache
      SERPSCRAP_DIAGNOSTICS_DIR: /var/lib/serpscrap/diagnostics
      SERPSCRAP_MAX_ACTIVE_JOBS: ${SERPSCRAP_MAX_ACTIVE_JOBS:-4}
      SERPSCRAP_MAX_QUEUED_JOBS: ${SERPSCRAP_MAX_QUEUED_JOBS:-16}
      SERVICE_FQDN_SERPSCRAP_APP_8000:
    volumes:
      - ../data/cache:/var/lib/serpscrap/cache
      - ../data/diagnostics:/var/lib/serpscrap/diagnostics
      - ../data/exports:/var/lib/serpscrap/exports
      - ../logs:/var/log/serpscrap
    depends_on:
      serpscrap-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  serpscrap-ui:
    image: ${SERPSCRAP_IMAGE:-serpscrap:2.0.0-alpha.1}
    restart: unless-stopped
    environment:
      SERPSCRAP_API_URL: http://serpscrap-app:8000/api/v1
      UI_HOST: 0.0.0.0
      UI_PORT: 8080
      SERVICE_FQDN_SERPSCRAP_UI_8080:
    entrypoint: ["python", "-m", "ui.app"]
    depends_on: [serpscrap-app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
